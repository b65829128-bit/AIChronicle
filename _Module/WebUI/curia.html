<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, height=760">
  <title>朝议 · 参政</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="curia.css">
</head>
<body>
  <div id="app">
    <aside class="rail">
      <div class="brand">
        <div class="seal">议</div>
        <div class="brand-copy">
          <div class="kicker">卡拉迪亚</div>
          <div class="brand-title">朝议</div>
          <div class="latin">CURIA CALRADIAE</div>
        </div>
      </div>
      <div class="rail-rule"><span></span><i></i><span></span></div>
      <nav id="nav" class="nav"></nav>
      <div class="rail-foot">
        <div class="key-row"><span class="key">M</span><span>关闭参政页</span></div>
        <div class="hint">据实而议 · 众议可 · 独断难</div>
      </div>
    </aside>

    <main class="main scrollable">
      <header class="topbar">
        <div>
          <div class="eyebrow" id="topEyebrow">王国朝议</div>
          <h1 id="topTitle">朝议</h1>
        </div>
        <div class="top-meta">
          <div id="topKingdom" class="top-kingdom"></div>
          <div id="topDate" class="top-date"></div>
        </div>
      </header>
      <div id="view"></div>
      <footer class="page-foot">
        <span>AI Chronicle · 朝议</span>
        <span id="footHint">投票公开 · 史官可读</span>
      </footer>
    </main>
  </div>
  <div id="status" class="status hidden"></div>
  <script src="curia.js"></script>
</body>
</html>
